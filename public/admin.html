<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin – Servicios 2ML</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;900&family=Open+Sans:wght@400;500;600&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --azul-oscuro: #0a2a5e;
      --azul-medio: #1a4a9e;
      --azul-claro: #2e6fd4;
      --azul-suave: #e8f0fe;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family:'Open Sans',sans-serif;
      background: linear-gradient(135deg, var(--azul-oscuro) 0%, #1a3a7e 50%, var(--azul-claro) 100%);
      min-height:100vh; display:flex; align-items:center; justify-content:center; padding:1rem;
    }
    .login-card {
      background:#fff; border-radius:20px;
      padding:3rem 2.5rem; width:100%; max-width:420px;
      box-shadow: 0 24px 64px rgba(0,0,0,0.35);
      animation: appear 0.4s ease;
    }
    @keyframes appear { from{opacity:0;transform:translateY(20px)} to{opacity:1;transform:translateY(0)} }
    .login-logo {
      text-align:center; margin-bottom:2rem;
    }
    .login-logo .nombre {
      font-family:'Montserrat',sans-serif;
      font-size:2rem; font-weight:900; color:var(--azul-oscuro);
    }
    .login-logo .nombre span { color:var(--azul-claro); }
    .login-logo .sub { color:#888; font-size:0.88rem; margin-top:0.3rem; }
    .admin-icon {
      width:70px; height:70px; background:var(--azul-suave);
      border-radius:50%; display:flex; align-items:center; justify-content:center;
      margin:0 auto 1rem; font-size:2rem;
    }
    h2 {
      font-family:'Montserrat',sans-serif;
      font-size:1.2rem; color:var(--azul-oscuro);
      text-align:center; margin-bottom:1.8rem;
    }
    .form-group { margin-bottom:1.2rem; }
    label { display:block; font-size:0.85rem; font-weight:600; color:#555; margin-bottom:0.4rem; }
    input[type=text], input[type=password] {
      width:100%; padding:0.75rem 1rem;
      border:2px solid #dde3f0; border-radius:8px;
      font-size:0.95rem; font-family:inherit;
      transition:border 0.2s; outline:none;
    }
    input:focus { border-color:var(--azul-claro); }
    .btn-login {
      width:100%; background:linear-gradient(135deg,var(--azul-oscuro),var(--azul-claro));
      color:#fff; border:none; padding:0.85rem;
      border-radius:8px; font-family:'Montserrat',sans-serif;
      font-size:1rem; font-weight:700; cursor:pointer;
      transition:opacity 0.2s, transform 0.2s; margin-top:0.5rem;
    }
    .btn-login:hover { opacity:0.9; transform:translateY(-1px); }
    .btn-login:disabled { opacity:0.6; cursor:not-allowed; transform:none; }
    .error-msg {
      background:#fde8e8; color:#c0392b; border:1px solid #f5aaaa;
      border-radius:8px; padding:0.7rem 1rem; font-size:0.87rem;
      text-align:center; margin-bottom:1rem; display:none;
    }
    .error-msg.visible { display:block; }
    .back-link {
      text-align:center; margin-top:1.5rem;
    }
    .back-link a {
      color:var(--azul-claro); font-size:0.87rem; text-decoration:none; font-weight:600;
    }
    .back-link a:hover { text-decoration:underline; }
    .loading { display:none; }
    .loading.visible { display:inline-block; }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="login-logo">
      <div class="admin-icon">🔐</div>
      <div class="nombre">Servicios <span>2ML</span></div>
      <div class="sub">Panel de Administración</div>
    </div>
    <h2>Iniciar sesión</h2>

    <div class="error-msg" id="errorMsg">❌ Usuario o contraseña incorrectos</div>

    <div class="form-group">
      <label for="username">Usuario</label>
      <input type="text" id="username" placeholder="admin" autocomplete="username"/>
    </div>
    <div class="form-group">
      <label for="password">Contraseña</label>
      <input type="password" id="password" placeholder="••••••••" autocomplete="current-password"
             onkeypress="if(event.key==='Enter') iniciarSesion()"/>
    </div>
    <button class="btn-login" id="btnLogin" onclick="iniciarSesion()">
      Entrar al panel →
    </button>

    <div class="back-link">
      <a href="/">← Volver a la página principal</a>
    </div>
  </div>

<script>
  // Si ya está autenticado, redirigir
  (async () => {
    const res = await fetch('/api/auth/check');
    const data = await res.json();
    if (data.authenticated) window.location.href = '/inventario';
  })();

  async function iniciarSesion() {
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;
    const btn = document.getElementById('btnLogin');
    const error = document.getElementById('errorMsg');

    if (!username || !password) {
      error.textContent = '⚠️ Por favor ingresa usuario y contraseña';
      error.classList.add('visible');
      return;
    }

    btn.disabled = true;
    btn.textContent = 'Verificando...';
    error.classList.remove('visible');

    try {
      const res = await fetch('/api/auth/login', {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ username, password })
      });
      const data = await res.json();
      if (res.ok && data.success) {
        btn.textContent = '✅ Acceso concedido...';
        setTimeout(() => window.location.href = '/inventario', 500);
      } else {
        error.textContent = '❌ ' + (data.error || 'Credenciales incorrectas');
        error.classList.add('visible');
        btn.disabled = false;
        btn.textContent = 'Entrar al panel →';
      }
    } catch(e) {
      error.textContent = '❌ Error de conexión con el servidor';
      error.classList.add('visible');
      btn.disabled = false;
      btn.textContent = 'Entrar al panel →';
    }
  }
</script>
</body>
</html>
